# ulama-gw — cascade-frame ↔ ULAMA gateway configuration.
# CLI flags override these values.

# cascade-core outbound (gw listens here)
cascade_in=127.0.0.1:5601

# cascade-core inbound (gw sends here)
cascade_out=127.0.0.1:5600

# ULAMA radio transport: unow | udp
transport=unow

# Monitor mode interface (UNOW transport)
iface=mon0

# Gateway node ID (1-253)
node=1

# Verbose logging
verbose=false

# For host-only UDP testing:
# transport=udp
# listen=0.0.0.0:5000
# peer=127.0.0.1:5001
