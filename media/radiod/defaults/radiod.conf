# radiod configuration
#
# interface: monitor mode interface name
iface=wlan0

# node_id: unique node identifier (1-253)
node_id=1

# tx_rate_mbps: legacy radiotap TX rate for injected frames.
# Increase to 6 or 12 for shorter airtime on strong links.
tx_rate_mbps=6

# tx_slot_size: max packets per TX slot (P1/P2/P3)
tx_slot_size=4

# rx_slot_us: RX slot duration in microseconds
rx_slot_us=2000

# ack_timeout_us: ACK wait timeout for reliable delivery
ack_timeout_us=8000

# ack_max_retry: max retransmissions for reliable delivery
ack_max_retry=2

# ---- SYNC protocol (TDMA + master election) ----
# sync: enable SYNC protocol (true/false)
#sync=false
# sync_dl_us: downlink slot duration in microseconds
#sync_dl_us=2000
# sync_ul_us: uplink slot duration in microseconds
#sync_ul_us=2000
# sync_guard_us: guard interval in microseconds
#sync_guard_us=300
