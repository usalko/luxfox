# vcpd — video capture daemon configuration.
# CLI flags override these values.

# Video source
source=/dev/video0
codec=libx264
bitrate=512
width=640
height=480
fps=25

# ULAMA transport: unow | udp
transport=unow
iface=mon0

# Node IDs
node=2
dst_node=1
stream_id=0

# Verbose logging
verbose=false

# For host-only UDP testing:
# transport=udp
# peer=127.0.0.1:5000
# listen=0.0.0.0:5002
