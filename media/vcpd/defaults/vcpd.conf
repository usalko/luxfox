# vcpd — video capture daemon for LuckFox Pico Ultra
# Verified 2026-06-22 on bench (Phase 4.1-4.3)

source=/dev/video0
bitrate=128
width=320
height=240
# === TEST: 1fps for radio packet loss debugging (revert to fps=25, gop=25) ===
fps=25                # TEST: minimal frame rate (25x less traffic)
gop=25                # TEST: 1 keyframe per second to match fps=1
smartp=true          # SmartP can yield recovery frames the browser never starts from
intra_refresh_rows=0 # this SDK rejects rc:refresh_* anyway; avoid false expectations
idr_interval_ms=2000 # force frequent real IDR until browser gets a decodable start frame

# Time-spread redundancy: extra delayed copies per video frame. Off (0) —
# tried redundancy=2 and it made things WORSE (build #432 field test): with
# only 1 UL slot per superframe for this single slave (num_slots=1, see
# sync.c's n_others==0 case), only ~1 video fragment/slot of airtime exists at
# all, and redundancy=2 triples the data competing for that fixed pipe. Result:
# video queue in radiod backed up to 6-11 deep (vs 0-1 with redundancy off),
# delaying fresh frames behind stale copies — exactly the "slow, keyframe
# cadence not held" symptom. The old "redundancy=2 reached ~20fps" baseline
# predates the num_slots=1 fix and assumed twice the airtime budget; it no
# longer applies. Leave at 0 unless the UL slot/superframe budget grows.
redundancy=0

transport=radiod

node=1
dst_node=254
stream_id=1

autostart=false
verbose=false

# ACK timeout and retry for UNOW transport
#ack_timeout_us=2000
#ack_retry=3

# For host-only UDP testing:
# transport=udp
# listen=0.0.0.0:5000
