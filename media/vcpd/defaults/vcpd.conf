# vcpd — video capture daemon for LuckFox Pico Ultra
# Verified 2026-06-22 on bench (Phase 4.1-4.3)

source=/dev/video0
bitrate=256
width=480
height=320
fps=15
gop=5                # GOP size: IDR every ~1.7s at real 3fps (reduces IDR loss impact)

transport=radiod

node=1
dst_node=254
stream_id=0

autostart=false
verbose=false

# Reliability mode for LTS video packets:
#   0 = unreliable (fire-and-forget, no ACK) — best for one-way video links
#       where the receiver cannot inject 802.11 ACK frames (e.g. host with
#       a standard WiFi adapter in monitor mode)
#   1 = last packet of each NAL only
#   2 = all packets (requires receiver to send ACKs via pcap_inject)
#   3 = adaptive: reliable only for NALs >= reliable_threshold packets
reliable=0
#reliable_threshold=3

# LTS packet payload size in bytes (default 1440, max 2281)
#lts_mtu=1440

# Inter-packet pacing within one NAL burst (default: 300 us for fps>5)
#pace_us=300

# ACK timeout and retry (only relevant when reliable >= 1)
#ack_timeout_us=2000
#ack_retry=3

# Forward error correction group size (0 = disabled, 2-8)
fec=2               # XOR FEC group size: recovers 1 lost packet per group of 2

# VPS/SPS/PPS repeat count before each IDR frame (redundancy on lossy links)
vps_repeat=2        # Send VPS/SPS/PPS twice before each IDR

# For host-only UDP testing:
# transport=udp
# listen=0.0.0.0:5000
# peer=127.0.0.1:5001
