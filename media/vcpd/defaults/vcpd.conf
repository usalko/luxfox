# vcpd — video capture daemon for LuckFox Pico Ultra
# Verified 2026-06-22 on bench (Phase 4.1-4.3)

source=/dev/video0
bitrate=256
width=480
height=320
fps=15
gop=5                # GOP size: IDR every ~1.7s at real 3fps (reduces IDR loss impact)

transport=radiod

node=1
dst_node=254
stream_id=0

autostart=false
verbose=false

# ACK timeout and retry for UNOW transport
#ack_timeout_us=2000
#ack_retry=3

# For host-only UDP testing:
# transport=udp
# listen=0.0.0.0:5000
# peer=127.0.0.1:5001
