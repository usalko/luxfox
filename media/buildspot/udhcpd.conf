# udhcpd configuration for Buildspot SSH gateway
# Device acts as DHCP server, distributes IPs to connecting hosts

# Interface to listen on
interface eth0

# IP pool start/end
start 192.168.100.100
end 192.168.100.254

# Subnet mask
opt subnet 255.255.255.0

# Router (device gateway)
opt router 192.168.100.1

# DNS (optional, can be device IP or public DNS)
opt dns 192.168.100.1 8.8.8.8

# Lease time (in seconds)
opt lease 3600

# Log level
# 0 = quiet, 1 = errors, 2 = warnings, 3 = info (default)
loglevel 2
