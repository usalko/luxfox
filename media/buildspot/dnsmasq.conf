# dnsmasq configuration for Buildspot SSH DHCP+DNS Gateway
# Device acts as DHCP and DNS server for connecting hosts

# Interface to listen on
interface=eth0
bind-interfaces
listen-address=192.168.100.1

# DHCP configuration
dhcp-range=eth0,192.168.100.100,192.168.100.254,255.255.255.0,12h

# DHCP options - CRITICAL for host to get DNS from device
dhcp-option=eth0,3,192.168.100.1            # Gateway (option 3)
dhcp-option=eth0,6,192.168.100.1            # DNS server (option 6)
dhcp-option=eth0,15,luxfox                  # Domain name (option 15)

# Device hostname resolution
address=/luxfox/192.168.100.1
address=/luckfox/192.168.100.1
address=/luckfox.local/192.168.100.1
address=/luxfox.local/192.168.100.1

# DNS configuration
no-resolv                           # Don't use /etc/resolv.conf
server=8.8.8.8                      # Upstream DNS (Google)
server=8.8.4.4
server=1.1.1.1                      # Cloudflare DNS (fallback)

# Logging and debugging
log-facility=/var/log/dnsmasq.log
log-queries                         # Log all DNS queries
log-dhcp                            # Log DHCP events

# Performance
cache-size=150
dns-forward-max=300

# DHCP lease database
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# PID file
pid-file=/var/run/dnsmasq.pid
